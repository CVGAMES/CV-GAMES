<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bad Time Simulator</title>
  <desc id="desc">Capa original de batalha arcade com um coração vermelho e padrões de ossos em pixel art.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d1b"/><stop offset=".56" stop-color="#15192b"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#ff3657" stop-opacity=".38"/><stop offset="1" stop-color="#ff3657" stop-opacity="0"/></radialGradient>
    <pattern id="pixels" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#88bfff" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/><rect width="960" height="540" rx="28" fill="url(#pixels)"/>
  <circle cx="683" cy="265" r="250" fill="url(#aura)"/>
  <g fill="#c9f3ff" opacity=".14" filter="url(#shadow)"><rect x="594" y="95" width="34" height="210" rx="17"/><rect x="802" y="184" width="34" height="210" rx="17"/></g>
  <g fill="#e9f7ff" stroke="#91d8ff" stroke-width="5">
    <rect x="615" y="93" width="26" height="228" rx="13"/><circle cx="628" cy="108" r="17"/><circle cx="628" cy="306" r="17"/>
    <rect x="824" y="202" width="26" height="228" rx="13"/><circle cx="837" cy="217" r="17"/><circle cx="837" cy="415" r="17"/>
    <rect x="682" y="130" width="24" height="220" rx="12" transform="rotate(90 694 240)"/><circle cx="594" cy="240" r="16"/><circle cx="794" cy="240" r="16"/>
  </g>
  <g transform="translate(699 282)" shape-rendering="crispEdges" fill="#ff3355" stroke="#ff93a1" stroke-width="5">
    <path d="M0 59-20 40-43 16-43-12-26-29-4-29 0-22 4-29 26-29 43-12 43 16 20 40Z"/>
    <path d="M-14-4h7M8-4h7" stroke="#fff" stroke-width="7" stroke-linecap="square"/>
  </g>
  <path d="M57 91h50" stroke="#61bdf4" stroke-width="8" stroke-linecap="round"/><text x="58" y="145" fill="#8ad9ff" font-family="Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="5">BATALHA · DESVIO · SOBREVIVA</text>
  <text x="53" y="278" fill="#fff" font-family="Arial,sans-serif" font-size="67" font-weight="950" letter-spacing="-2">BAD TIME</text>
  <text x="53" y="363" fill="#8ad9ff" font-family="Arial,sans-serif" font-size="76" font-weight="950" letter-spacing="2">SIMULATOR</text>
  <text x="60" y="427" fill="#bcc8da" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">DESVIE DOS OSSOS. PROTEJA O CORAÇÃO.</text>
  <rect x="34" y="34" width="892" height="472" rx="22" fill="none" stroke="#8ad9ff" stroke-opacity=".27" stroke-width="2"/>
</svg>
