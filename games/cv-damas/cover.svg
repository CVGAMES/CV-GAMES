<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CV DAMAS</title>
  <desc id="desc">Capa do CV DAMAS com tabuleiro verde e marfim, peças detalhadas e identidade visual do CV GAMES.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071321"/><stop offset=".52" stop-color="#102438"/><stop offset="1" stop-color="#122c35"/>
    </linearGradient>
    <radialGradient id="greenGlow">
      <stop stop-color="#50e0a4" stop-opacity=".3"/><stop offset="1" stop-color="#50e0a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#74bbff" stop-opacity=".2"/><stop offset="1" stop-color="#74bbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mintText" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c2ffe1"/><stop offset="1" stop-color="#65dfa5"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d7c9a6"/><stop offset=".45" stop-color="#788f7c"/><stop offset="1" stop-color="#263b3d"/>
    </linearGradient>
    <linearGradient id="darkPieceFill" x1=".1" y1="0" x2=".8" y2="1">
      <stop stop-color="#7087a0"/><stop offset=".38" stop-color="#263b53"/><stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <linearGradient id="lightPieceFill" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#fffef4"/><stop offset=".55" stop-color="#e2e5d9"/><stop offset="1" stop-color="#a9b7ac"/>
    </linearGradient>
    <pattern id="squares" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#e9e4d3"/>
      <path d="M0 0h40v40H0zM40 40h40v40H40z" fill="#60816e"/>
      <path d="M0 0h40v40H0zM40 40h40v40H40z" fill="#91ad91" opacity=".2"/>
    </pattern>
    <filter id="boardShadow" x="-35%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="pieceShadow" x="-45%" y="-45%" width="190%" height="210%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#07111a" flood-opacity=".62"/>
    </filter>
    <g id="dark-checker" filter="url(#pieceShadow)">
      <ellipse cy="5" rx="16" ry="12" fill="#07101a" opacity=".55"/>
      <circle r="15" fill="url(#darkPieceFill)" stroke="#9cb0be" stroke-width="1.7"/>
      <circle r="10.5" fill="none" stroke="#c4d5dc" stroke-opacity=".26" stroke-width="1.1"/>
      <path d="M-8-7q6-6 13-3" fill="none" stroke="#f0fbff" stroke-linecap="round" stroke-opacity=".55" stroke-width="2"/>
    </g>
    <g id="light-checker" filter="url(#pieceShadow)">
      <ellipse cy="5" rx="16" ry="12" fill="#07101a" opacity=".45"/>
      <circle r="15" fill="url(#lightPieceFill)" stroke="#f7f2df" stroke-width="1.7"/>
      <circle r="10.5" fill="none" stroke="#73877b" stroke-opacity=".38" stroke-width="1.1"/>
      <path d="M-8-7q6-6 13-3" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".9" stroke-width="2"/>
    </g>
    <g id="crown" fill="#f3cc73" stroke="#6d5323" stroke-width="1">
      <path d="m-8 5 1-9 5 4 3-7 3 7 5-4 1 9z"/>
      <path d="M-7 7h14" fill="none" stroke="#fff0b4" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="url(#background)"/>
  <ellipse cx="780" cy="272" rx="330" ry="320" fill="url(#greenGlow)"/>
  <ellipse cx="400" cy="30" rx="360" ry="210" fill="url(#blueGlow)"/>
  <path d="M0 449 413 36M110 540 620 30M310 540 810 40M565 540 960 145" fill="none" stroke="#b8ffe1" stroke-opacity=".035" stroke-width="2"/>
  <circle cx="470" cy="104" r="2" fill="#c3f5ff" opacity=".8"/>
  <circle cx="520" cy="430" r="3" fill="#9decc2" opacity=".7"/>

  <text x="64" y="158" fill="#9eebc0" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="4">ESTRATÉGIA EM DUAS CORES</text>
  <path d="M64 184h115" stroke="#62dfa5" stroke-width="3" stroke-linecap="round"/>
  <text x="56" y="270" fill="#f5f8f4" font-family="Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="-8">CV</text>
  <text x="54" y="358" fill="url(#mintText)" font-family="Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-5">DAMAS</text>

  <g transform="translate(568 79) rotate(5 176 180)" filter="url(#boardShadow)">
    <rect x="-17" y="-17" width="366" height="366" rx="27" fill="#081521" opacity=".55"/>
    <rect x="-12" y="-12" width="356" height="356" rx="24" fill="url(#frame)" stroke="#d5e7d1" stroke-opacity=".65" stroke-width="2"/>
    <rect width="332" height="332" rx="12" fill="url(#squares)" stroke="#f4edda" stroke-width="5"/>
    <path d="M10 10h312v312H10z" fill="none" stroke="#213d36" stroke-opacity=".35" stroke-width="2"/>

    <g>
      <use href="#dark-checker" x="20" y="20"/><use href="#dark-checker" x="100" y="20"/><use href="#dark-checker" x="180" y="20"/><use href="#dark-checker" x="260" y="20"/>
      <use href="#dark-checker" x="60" y="60"/><use href="#dark-checker" x="140" y="60"/><use href="#dark-checker" x="220" y="60"/><use href="#dark-checker" x="300" y="60"/>
      <use href="#dark-checker" x="20" y="100"/><use href="#dark-checker" x="100" y="100"/><use href="#dark-checker" x="180" y="100"/><use href="#dark-checker" x="260" y="100"/>
      <use href="#light-checker" x="60" y="220"/><use href="#light-checker" x="220" y="220"/><use href="#light-checker" x="300" y="220"/>
      <use href="#light-checker" x="20" y="260"/><use href="#light-checker" x="100" y="260"/><use href="#light-checker" x="180" y="260"/><use href="#light-checker" x="260" y="260"/>
      <use href="#light-checker" x="60" y="300"/><use href="#light-checker" x="140" y="300"/><use href="#light-checker" x="220" y="300"/><use href="#light-checker" x="300" y="300"/>
    </g>

    <path d="M143 218Q179 183 216 145" fill="none" stroke="#b7ffdc" stroke-opacity=".88" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
    <path d="m211 149 13-7-2 14" fill="#b7ffdc"/>
    <circle cx="140" cy="220" r="21" fill="none" stroke="#a5f3c8" stroke-opacity=".72" stroke-width="2"/>
    <circle cx="220" cy="140" r="19" fill="#a5f3c8" fill-opacity=".12" stroke="#a5f3c8" stroke-opacity=".82" stroke-width="2" stroke-dasharray="4 4"/>
    <use href="#light-checker" x="140" y="220"/>
    <use href="#dark-checker" x="180" y="180"/>
    <use href="#crown" transform="translate(180 178) scale(.65)"/>
    <rect x="8" y="8" width="316" height="316" rx="8" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
  </g>

  <g transform="translate(786 446)">
    <circle r="34" fill="#123638" stroke="#72e8ae" stroke-opacity=".54"/>
    <path d="M-13 0h26M0-13v26" stroke="#a9f8ce" stroke-linecap="round" stroke-width="4" opacity=".88"/>
  </g>
</svg>
