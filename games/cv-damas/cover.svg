<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">CV DAMAS</title>
  <desc id="desc">Tabuleiro escuro de damas com peças claras e escuras.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c192b"/><stop offset="1" stop-color="#142b38"/></linearGradient>
    <linearGradient id="lightPiece" x2=".3" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#b8c5d2"/></linearGradient>
    <linearGradient id="darkPiece" x2=".3" y2="1"><stop stop-color="#5c6f85"/><stop offset="1" stop-color="#131e30"/></linearGradient>
    <pattern id="board" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#e8e2cf"/><rect width="40" height="40" fill="#71927f"/><rect x="40" y="40" width="40" height="40" fill="#71927f"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="640" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="542" cy="45" r="120" fill="#53d6a1" opacity=".08"/>
  <text x="38" y="64" fill="#95e9bd" font-family="system-ui,sans-serif" font-size="17" font-weight="900" letter-spacing="4">EXCLUSIVO CV GAMES</text>
  <text x="36" y="126" fill="#f3f7fb" font-family="system-ui,sans-serif" font-size="51" font-weight="950" letter-spacing="-3">CV DAMAS</text>
  <text x="39" y="157" fill="#b8c8da" font-family="system-ui,sans-serif" font-size="16">Duas cores. Um tabuleiro. Cada captura muda tudo.</text>
  <g transform="translate(286 20)" filter="url(#shadow)">
    <rect x="-8" y="-8" width="336" height="336" rx="18" fill="#243448" stroke="#70927f" stroke-opacity=".55" stroke-width="2"/>
    <rect width="320" height="320" rx="10" fill="url(#board)"/>
    <g fill="url(#darkPiece)" stroke="#0e1725" stroke-width="2">
      <circle cx="60" cy="20" r="14"/><circle cx="140" cy="20" r="14"/><circle cx="220" cy="20" r="14"/><circle cx="300" cy="20" r="14"/>
      <circle cx="20" cy="60" r="14"/><circle cx="100" cy="60" r="14"/><circle cx="180" cy="60" r="14"/><circle cx="260" cy="60" r="14"/>
      <circle cx="60" cy="100" r="14"/><circle cx="140" cy="100" r="14"/><circle cx="220" cy="100" r="14"/><circle cx="300" cy="100" r="14"/>
    </g>
    <g fill="url(#lightPiece)" stroke="#667589" stroke-width="2">
      <circle cx="20" cy="220" r="14"/><circle cx="100" cy="220" r="14"/><circle cx="180" cy="220" r="14"/><circle cx="260" cy="220" r="14"/>
      <circle cx="60" cy="260" r="14"/><circle cx="140" cy="260" r="14"/><circle cx="220" cy="260" r="14"/><circle cx="300" cy="260" r="14"/>
      <circle cx="20" cy="300" r="14"/><circle cx="100" cy="300" r="14"/><circle cx="180" cy="300" r="14"/><circle cx="260" cy="300" r="14"/>
    </g>
    <circle cx="180" cy="180" r="16" fill="url(#lightPiece)" stroke="#667589" stroke-width="2"/>
    <circle cx="220" cy="140" r="16" fill="url(#darkPiece)" stroke="#0e1725" stroke-width="2"/>
    <path d="M180 173l2 5 5 .2-4 3 1.5 5-4.5-3-4.5 3 1.5-5-4-3 5-.2z" fill="#bc984d"/>
  </g>
</svg>
